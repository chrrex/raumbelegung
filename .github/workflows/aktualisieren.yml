name: Raumbelegung aktualisieren

on:
  schedule:
    # Alle 15 Minuten zwischen 05:00 und 18:59 UTC.
    # Das entspricht 07:00-20:59 deutscher Sommerzeit, 06:00-19:59 im Winter.
    - cron: "*/15 5-18 * * *"
    - cron: "30 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Der Bau-Rechner läuft auf Weltzeit – ohne das stünde im Kopf der Seite
# eine um ein bis zwei Stunden zu frühe Uhrzeit.
env:
  TZ: Europe/Berlin

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  bauen:
    runs-on: ubuntu-latest
    steps:
      - name: Quellcode holen
        uses: actions/checkout@v5

      - name: Ruby bereitstellen
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Übersicht bauen
        env:
          ET_API_KEY:      ${{ secrets.ET_API_KEY }}
          ET_API_ORG:      ${{ secrets.ET_API_ORG }}
          SEITEN_PASSWORT: ${{ secrets.SEITEN_PASSWORT }}
        run: ruby build.rb --wochen=10

      - name: Ergebnis einpacken
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  veroeffentlichen:
    needs: bauen
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.veroeffentlichung.outputs.page_url }}
    steps:
      - name: Auf GitHub Pages stellen
        id: veroeffentlichung
        uses: actions/deploy-pages@v5
